services:
  electrs:
    image: "bitcoin-node/electrs:${ELECTRS_VERSION_TAG}"
    container_name: electrs
    build:
      context: ./electrs
      args:
        INDEXER_LINUX_UID: ${INDEXER_LINUX_UID}
        INDEXER_LINUX_GID: ${INDEXER_LINUX_GID}
    env_file:
      - ./conf/docker-common.conf
      - ./conf/docker-bitcoind.conf
      - ./conf/docker-indexer.conf
    restart: unless-stopped
    command: /restart.sh
    volumes:
      - data-electrs:/home/electrs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    stop_grace_period: 1m
    depends_on:
      - tor
    networks:
      dojonet:
        ipv4_address: ${NET_INDEXER_IPV4}

volumes:
  data-electrs:
