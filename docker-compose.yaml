services:
  tor:
    image: "bitcoin-node/tor:${TOR_VERSION_TAG}"
    container_name: tor
    build:
      context: ./tor
      args:
        TOR_LINUX_UID: ${TOR_LINUX_UID}
        TOR_LINUX_GID: ${TOR_LINUX_GID}
    env_file:
      - ./conf/docker-common.conf
      - ./conf/docker-bitcoind.conf
      - ./conf/docker-indexer.conf
      - ./conf/docker-tor.conf
    restart: unless-stopped
    command: /restart.sh
    volumes:
      - data-tor:/var/lib/tor
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    networks:
      dojonet:
        ipv4_address: ${NET_TOR_IPV4}

networks:
  dojonet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  data-tor:
  data-bitcoin:
